[package]
name = "raybend"
description = "raybend（光伴）核心库：媒体、索引、RAW 解码、缩略图与渲染"
# crates.io 页面呈现用（占名 + 社区可发现）。keywords 最多 5 个，categories 用官方枚举值。
keywords = ["photo", "photography", "raw", "image"]
categories = ["multimedia::images"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
getrandom.workspace = true
rusqlite.workspace = true
kamadak-exif.workspace = true
rawler.workspace = true
trash.workspace = true
image.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
wgpu.workspace = true
pollster.workspace = true
lensfun.workspace = true
sha2 = "0.10.9"
# Already locked/transitive; parse native XMP without a new XML implementation.
roxmltree = "0.20.0"
flate2 = "1.1.10"
webp = { version = "0.3.1", default-features = false }
notify = { version = "8.2.0", default-features = false }
lcms2 = { version = "6.2.0", features = ["static"] }
png = "0.18.1"
# Already present through image; only packs the GPU presentation texture, CPU stays f32.
half = "2.7.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"], optional = true }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target."cfg(windows)".dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
ai-runtime = ["dep:ort"]
ai-probe = ["ai-runtime"]

[[example]]
name = "ai-probe"
required-features = ["ai-probe"]
