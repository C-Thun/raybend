[workspace]
resolver = "3"
members = ["src-tauri", "crates/raybend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
authors = ["raybend contributors"]
repository = "https://github.com/C-Thun/raybend"

[workspace.dependencies]
libc = "0.2"
# 内部 crate
raybend = { path = "crates/raybend" }

# 第三方（随使用逐步补充，不预置未使用的依赖）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 数据底座（M1-2）
rusqlite = { version = "0.40", features = ["bundled"] }   # bundled：自带 SQLite 源码，Windows 上不依赖系统 sqlite
getrandom = "0.4"                                          # 库 ID 的随机段（见 LIBRARY.md §2.5）
unicode-normalization = "0.1"                              # 路径 NFC 规范化（std 不提供）
tempfile = "3"                                             # 仅测试用（临时目录）

# 元数据抽取（M1-3）：纯 Rust 的 EXIF 读取器。RapidRAW 也用同一个
# （它另引 little_exif 只用于**写回**，本项目不写 EXIF）。
# 注意：只读 EXIF；RAW 的元数据将来走 rawler（FUTURE.md B8）。
kamadak-exif = "0.6"

# RAW 解码（M2-W1）：LGPL-2.1-only，与 AGPL-3.0 兼容（AGENTS.md §6.3）。
# ⚠️ API 不稳定且不遵循 SemVer；**只允许在 `crates/raybend/src/raw/` 内使用**，
# 且必须在 worker 进程里调用（上游明说不要拿它处理不可信文件）。
rawler = "0.8.0"

# 删除到系统回收站（M2-W1）：**只做「移到回收站」，不提供永久删除**。
# MIT；Windows 上带 COM 初始化（default feature `coinit_apartmentthreaded`）。
trash = "5.2"

# 缩略图（M1-3）+ 缓存编码（M3-W3）。
#
# `avif`：人类 2026-09-24 定「**系统中所有缓存图都用 AVIF，质量 90、次级采样 4:4:4**」——
# 由 `image` 的 avif 编码器（底层 ravif，纯 Rust，无系统库）提供。
# 走 **RGB8** 输入才会得到 4:4:4（ravif 的 `encode_rgba` 是 4:2:0），见 `thumbnail::render::encode_avif`。
# 将来 JXL 生态成熟后换 JXL（已登记 `FUTURE.md` §C8）。
#
# `webp`：M3-W6c 的 LUT 封面需要 —— ① 人类 2026-09-25 给的内置样片本身就是 WebP；
# ② 用户自带的演示图按规格也在支持列表里（`design/editor.md` §3.1.1）。
# WebP 解码走纯 Rust（`image-webp`）；有损封面编码单独使用 `webp` / 静态 libwebp。
# `image` 只支持无损 WebP；2026-09-26 替换会严重丢失色度的 webp-rust，保留封面质量 80。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "avif", "avif-native", "webp", "rayon"] }
# 渲染（M2-W1 spike；AGENTS.md §6.1 定的方案 B = webview 挖洞 + wgpu 直绘到窗口表面）。
# 版本 30.0.1：**上游最新**。AGENTS.md §3 记着 RapidRAW 曾把 wgpu 降到 29.0 以规避
# Apple 设备上的 P3 色偏 —— 那是 macOS 的问题，本项目 Windows 优先，先从最新版起步
# （真在 macOS 上踩到再降，且那时我们本来也要自己接色彩管理）。
# 依赖位只允许 `crates/raybend/src/render/` 与 `src-tauri` 的 spike 壳使用。
wgpu = "30.0.1"
# 在**同步**代码里跑 wgpu 的 async 初始化（渲染线程不是 async 的）。
# 用它而不是 `tauri::async_runtime`：业务 crate 不许依赖 tauri（AGENTS.md §4）。
pollster = "0.4"

# 镜头校正数据库（M3-W4）：[lensfun](https://lensfun.github.io/) 的**纯 Rust 移植**
# （`vdavid/lensfun-rs`，无 C 依赖，XML 库 gzip 后嵌在二进制里）。
# 许可：代码 **LGPL-3.0-or-later**（可经 GPL-3.0 路径与 AGPL-3.0 组合，与 rawler 同一套论证），
# 数据 **CC BY-SA 3.0**（原样分发 + 署名）——已登记 `THIRD-PARTY-NOTICES.md`。
# ⚠️ API 仍在 0.x（beta）：**只允许在 `crates/raybend/src/lens/` 内使用**，
# 其它模块只认我们自己的 `develop::lens::LensCorrection`（与 raw 后端可插拔同一套分层纪律）。
lensfun = "0.7"

# Windows 平台调用：文件身份（GetFileInformationByHandleEx）/ 驱动器类型（GetDriveTypeW）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

# workspace 强制：profile 只能定义在根
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 图像类工作负载在 dev 下也需要足够性能（详见 AGENTS.md）
[profile.dev]
opt-level = 2
debug = 1
incremental = true

# 测试档**关掉增量编译**（2026-09-17）：
# 增量编译下 `cargo test` 偶发链接失败 ——
# `rust-lld: error: undefined hidden symbol ... .llvm.*`（陈旧目标文件），
# 反复出现，每次都要 `cargo clean -p raybend` 才能继续。
# 代价：改完之后测试二进制要整份重编（几十秒），换来「跑得稳」。
# 源码改得勤的时候这个交换很划算 —— 链接失败一次就浪费一分钟以上。
[profile.test]
incremental = false

[profile.dev.package."*"]
opt-level = 3
