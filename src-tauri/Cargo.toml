[package]
name = "raybend-desktop"
description = "raybend（光伴）桌面外壳：窗口、WebView 与 IPC 边界"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# 此处的 `_lib` 后缀看似冗余，但用于让 lib 名与 bin 名不冲突。
# 这在 Windows 上是必需的，见 https://github.com/rust-lang/cargo/issues/8519
name = "raybend_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# NOTE: [profile.*] 必须定义在 workspace 根（见仓库根 Cargo.toml）

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建必须启用此项。
#
# 原因（已定位到源码）：tauri 的 build.rs 用 `dev = !custom-protocol` 决定是否为开发模式；
# 而 tauri-codegen 在 `dev && devUrl.is_some()` 时会产出**空的嵌入资源**，
# 于是 webview 只能去连 devUrl（http://localhost:1420）—— 本机没服务时页面就打不开。
#
# Tauri CLI 的 `tauri build` 会自动加这个 feature；但本项目的 Windows 构建路径不走 CLI
# （见 AGENTS.md §5.3），必须手动 `--features custom-protocol`。
# 注意：`tauri dev` 路径不要加，否则嵌入资源会取代热重载。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# 取窗口裸句柄交给 wgpu（渲染 spike）。版本必须与 tauri / wgpu 用的一致 —— 
# 都是 0.6（锁里只有一份 raw-window-handle 0.6.2），分叉的话 create_surface 会在运行时失败。
raw-window-handle = "0.6"
tauri = { version = "2", features = [] }
raybend.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "2.7.3"
image.workspace = true
tauri-plugin-updater = "2"

# 与当前 Tauri 2.11 的 WebView2 COM 类型一致；依赖已在锁文件里，无额外 DLL。
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
